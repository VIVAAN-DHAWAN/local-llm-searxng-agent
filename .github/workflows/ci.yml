name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r llm_web_agent/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python files
        run: python -m py_compile llm_web_agent/*.py
