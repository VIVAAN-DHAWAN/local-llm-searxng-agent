name: Feature request
description: Suggest a local-first improvement.
title: "Feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the agent do better?
    validations:
      required: true
  - type: textarea
    id: local_first
    attributes:
      label: Local-first/privacy considerations
      description: How does this avoid cloud defaults, telemetry, prompt logs, or public exposure?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      value: |
        ```bash
        python3 -m pytest -q
        ```
