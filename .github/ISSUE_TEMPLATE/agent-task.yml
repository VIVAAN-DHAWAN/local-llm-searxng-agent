name: Agent-friendly task
description: A scoped implementation task with clear verification.
title: "Agent task: "
labels: ["agent-friendly", "needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / non-goals
      description: Mention files likely involved and anything that must not change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      value: |
        ```bash
        python3 -m pytest -q
        python3 -m py_compile llm_web_agent/*.py
        ```
  - type: textarea
    id: privacy
    attributes:
      label: Privacy boundary
      value: |
        - Keep defaults local.
        - Do not add telemetry or prompt logging.
        - Do not commit secrets or private prompts.
