name: Bug report
description: Report setup, SearxNG, local LLM, or CLI behavior problems.
title: "Bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, private prompts, full local paths with usernames, or sensitive search results.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the failure and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Podman version, local LLM server, SearxNG URL binding.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, prompts, private URLs, and local usernames before posting.
      render: text
